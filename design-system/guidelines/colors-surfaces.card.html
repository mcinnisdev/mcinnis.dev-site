<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-page);font-family:var(--font-ui)}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px">

</div></body></html>
