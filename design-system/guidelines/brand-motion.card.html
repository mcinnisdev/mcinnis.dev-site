<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-page);font-family:var(--font-ui)}</style></head><body><div style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;gap:14px;align-items:center">
<span style="display:inline-flex;height:40px;align-items:center;padding:0 16px;border-radius:var(--radius-sm);background:var(--orange-500);color:#fff;font-family:var(--font-ui);font-weight:500;box-shadow:var(--shadow-1)">rest</span>
<span style="display:inline-flex;height:40px;align-items:center;padding:0 16px;border-radius:var(--radius-sm);background:var(--orange-600);color:#fff;font-family:var(--font-ui);font-weight:500;box-shadow:var(--shadow-accent-glow)">hover</span>
<span style="display:inline-flex;height:40px;align-items:center;padding:0 16px;border-radius:var(--radius-sm);background:var(--orange-600);color:#fff;font-family:var(--font-ui);font-weight:500;transform:scale(.985)">press</span>
<span style="display:inline-flex;height:40px;align-items:center;padding:0 16px;border-radius:var(--radius-sm);background:var(--orange-500);color:#fff;font-family:var(--font-ui);font-weight:500;opacity:.42">disabled</span>
</div>
<div class="ds-label">--dur-fast 140ms · --dur-base 220ms · --ease-standard cubic-bezier(.2,0,.2,1) · --lift-hover -2px</div>
</div></body></html>
