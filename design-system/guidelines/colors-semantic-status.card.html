<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:var(--surface-page);font-family:var(--font-ui)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
<div style="display:flex;flex-direction:column;gap:6px"><div style="height:56px;border-radius:var(--radius-sm);background:var(--moss-100);display:flex;align-items:center;justify-content:center"><span style="width:26px;height:26px;border-radius:999px;background:var(--moss-500)"></span></div><div style="font-family:var(--font-mono);font-size:10px;line-height:1.5"><div style="color:var(--text-display)">--moss-500 / 100</div><div style="color:var(--text-meta)">active</div></div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:56px;border-radius:var(--radius-sm);background:var(--amber-100);display:flex;align-items:center;justify-content:center"><span style="width:26px;height:26px;border-radius:999px;background:var(--amber-500)"></span></div><div style="font-family:var(--font-mono);font-size:10px;line-height:1.5"><div style="color:var(--text-display)">--amber-500 / 100</div><div style="color:var(--text-meta)">in progress</div></div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:56px;border-radius:var(--radius-sm);background:var(--rust-100);display:flex;align-items:center;justify-content:center"><span style="width:26px;height:26px;border-radius:999px;background:var(--rust-500)"></span></div><div style="font-family:var(--font-mono);font-size:10px;line-height:1.5"><div style="color:var(--text-display)">--rust-500 / 100</div><div style="color:var(--text-meta)">error</div></div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:56px;border-radius:var(--radius-sm);background:var(--slate-100);display:flex;align-items:center;justify-content:center"><span style="width:26px;height:26px;border-radius:999px;background:var(--slate-500)"></span></div><div style="font-family:var(--font-mono);font-size:10px;line-height:1.5"><div style="color:var(--text-display)">--slate-500 / 100</div><div style="color:var(--text-meta)">note</div></div></div>
</div></body></html>
